<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Claude sessions built Tetris and read each other's notes</title>
<meta name="description" content="Ten concurrent Claude Code sessions, one shared decision graph, 386 nodes in 26 minutes. What they borrowed from each other, how, and what broke.">
<meta property="og:title" content="Ten Claude sessions built Tetris and read each other's notes">
<meta property="og:description" content="One shared decision graph, ten agents, 26 minutes, 170 borrowed ideas with provenance. And zero edges between them.">
<meta property="og:type" content="article">
<meta property="og:image" content="fig-lanes.svg">
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --line:#1e293b; --link:#7dd3fc; --code:#0b1120; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
  main { max-width:760px; margin:0 auto; padding:48px 20px 80px }
  h1 { font-size:2.1rem; line-height:1.15; letter-spacing:-.5px; margin:0 0 8px }
  h2 { font-size:1.35rem; margin:44px 0 12px; padding-top:20px; border-top:1px solid var(--line) }
  p, li { color:var(--fg) }
  a { color:var(--link); text-decoration:none } a:hover { text-decoration:underline }
  blockquote { margin:18px 0; padding:12px 18px; border-left:3px solid #f472b6; background:#111c31; color:#cbd5e1; font-size:.95rem }
  blockquote p { margin:0 }
  pre, code { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:.86em }
  pre { background:var(--code); border:1px solid var(--line); border-radius:8px; padding:14px 16px; overflow-x:auto }
  code { background:var(--code); padding:1px 5px; border-radius:4px }
  pre code { background:none; padding:0 }
  table { width:100%; border-collapse:collapse; margin:18px 0; font-size:.9rem }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top }
  th { color:var(--muted); font-weight:600 }
  img { max-width:100%; height:auto; border-radius:8px; border:1px solid var(--line) }
  p > img:only-child { display:block; margin:24px auto }
  .byline { color:var(--muted); font-size:.95rem; margin:0 0 30px }
  .gallery { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:20px 0 }
  .gallery figure { margin:0 }
  .gallery img { border-radius:6px }
  .gallery figcaption { text-align:center; color:var(--muted); font-size:.8rem; margin-top:4px }
  @media (max-width:700px) { .gallery { grid-template-columns:repeat(2,1fr) } h1 { font-size:1.7rem } }
  footer { margin-top:60px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:.9rem }
</style>
</head>
<body>
<main>
  <article id="post"><p class="byline">Loading post.md…</p></article>
  <footer>
    Source and data: <a href="https://github.com/notactuallytreyanastasio/tetris-arena">tetris-arena</a> ·
    Tooling: <a href="https://deciduous.dev">deciduous</a> ·
    Post text: <a href="post.md">post.md</a>
  </footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  fetch("post.md").then(r => r.text()).then(md => {
    const el = document.getElementById("post");
    el.innerHTML = marked.parse(md);
    const h1 = el.querySelector("h1");
    const by = document.createElement("p");
    by.className = "byline";
    by.textContent = "22 September 2026 · written from the tetris-arena decision graph, snapshot at 05:05 UTC";
    h1.after(by);
  }).catch(e => { document.getElementById("post").textContent = "Could not load post.md: " + e; });
</script>
</body>
</html>
