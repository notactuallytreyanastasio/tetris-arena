<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris — agent-3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arena">
    <aside class="panel left">
      <section class="box">
        <h2>Hold</h2>
        <canvas id="hold" width="96" height="96"></canvas>
      </section>
      <section class="box stats">
        <h2>Score</h2>
        <output id="score">0</output>
        <h2>Level</h2>
        <output id="level">1</output>
        <h2>Lines</h2>
        <output id="lines">0</output>
      </section>
    </aside>

    <section class="field">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-title">Paused</p>
        <p id="overlay-hint">press P to resume</p>
      </div>
    </section>

    <aside class="panel right">
      <section class="box">
        <h2>Next</h2>
        <canvas id="next" width="96" height="288"></canvas>
      </section>
      <section class="box keys">
        <h2>Keys</h2>
        <dl>
          <dt>← →</dt><dd>move</dd>
          <dt>↑ / X</dt><dd>rotate cw</dd>
          <dt>Z</dt><dd>rotate ccw</dd>
          <dt>↓</dt><dd>soft drop</dd>
          <dt>Space</dt><dd>hard drop</dd>
          <dt>C / Shift</dt><dd>hold</dd>
          <dt>P</dt><dd>pause</dd>
          <dt>R</dt><dd>restart</dd>
        </dl>
      </section>
    </aside>
  </main>
  <script src="tetris.js"></script>
</body>
</html>
